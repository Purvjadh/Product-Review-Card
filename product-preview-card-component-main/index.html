<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
</head>
<body>

 <article>
  <picture class="product__image">
    <source media="(min-width: 700px)" srcset="/product-preview-card-component-main/images/image-product-desktop.jpg">
    <img src="/product-preview-card-component-main/images/image-product-mobile.jpg" alt="image-product-mobile">
  </picture>

  <div>
  <p class="product__heading">Perfume</p>

  <h1 class="product__title">Gabrielle Essence Eau De Parfum</h1>

  <p class="product_desc">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</p>

  <section class="flex-group">
   <p> $149.99</p>
   <p> $169.99</p>
  </section>

 <button class="button"> Add to Cart</button>
  </div>
 </article>

  
  
</body>
</html>
